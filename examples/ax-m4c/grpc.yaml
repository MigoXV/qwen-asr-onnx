# Qwen3-ASR AX650 gRPC 服务配置。
#
# 启动：
#   export LD_LIBRARY_PATH=/soc/lib
#   poetry run python -m qwen_asr_onnx.commands.app serve \
#     --config examples/ax-m4c/grpc.yaml

model: ${oc.env:MODEL_PATH,/workspace/model-bin/AXERA-TECH/Qwen3-ASR-0.6B-AX650-C64-P448-CTX2047}

# AX 固定 prompt 暂不支持 context；保留此字段仅用于兼容旧配置。
context: ${oc.env:QWEN_ASR_CONTEXT,""}

server_port: ${oc.env:GRPC_PORT,50051}

ax:
  # 服务对外就绪前执行一次设备预热。
  warmup: ${oc.env:QWEN_ASR_AX_WARMUP,true}
  # 包含正在执行的请求；单 AX handle 始终串行执行。
  max_inflight_requests: ${oc.env:QWEN_ASR_MAX_INFLIGHT_REQUESTS,2}
  shutdown_grace_seconds: ${oc.env:QWEN_ASR_SHUTDOWN_GRACE_SECONDS,5.0}
