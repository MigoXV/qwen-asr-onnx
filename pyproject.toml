[project]
name = "qwen-asr-onnx"
version = "0.1.0"
description = ""
authors = [
    {name = "wcy",email = "wcy@gmail.com"},
    {name = "wcw",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "grpcio (>=1.78.0,<2.0.0)",
    "grpcio-health-checking (>=1.78.0,<2.0.0)",
    "protobuf (>=6.33.5,<7.0.0)",
    "typer (>=0.24.0,<0.25.0)",
    "cffi (>=2.1.1,<3.0.0)",
]

[project.scripts]
qwen-asr = "qwen_asr_onnx.commands.app:app"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[tool.poetry]
packages = [{include = "qwen_asr_onnx", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
numpy = "<2.3"
librosa = ">=0.10,<0.12"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
